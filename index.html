<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>PCH Toolbox Control</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#102941">
<meta name="apple-mobile-web-app-title" content="PCH Tools">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* PCH Toolbox Control — production styles derived from the approved PCH_TOOLBOX_VISUAL_PROTOTYPE.html */
:root{--navy:#142b43;--navy2:#294862;--blue:#1269bc;--bg:#f3f6fa;--page:#eaf0f5;--line:#e1e8f0;--text:#25394e;--sub:#77889b;--green:#147c55;--greenbg:#e7f4eb;--amber:#ad7019;--amberbg:#fff1dc;--red:#b42318;--redbg:#fdecea}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--page);-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}
:focus-visible{outline:3px solid #7fb4ea;outline-offset:2px}
img{max-width:100%}
.hidden{display:none!important}
.role-quality .mgr{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- admin shell ---------- */
.shell{min-height:100vh;display:flex}
.sidebar{width:238px;background:var(--navy);color:#fff;padding:24px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 25px;border-bottom:1px solid #ffffff20}
.brand-icon{background:#fff;width:46px;height:46px;display:grid;place-items:center;border-radius:10px;overflow:hidden;flex-shrink:0}
.brand-icon img{width:42px;height:42px;object-fit:contain}
.brand-icon.mark{background:none}.brand-icon.mark img{width:46px;height:46px}
.brand-icon.txt{background:#217ad1;color:#fff;font-size:24px;font-weight:800}
.brand strong{letter-spacing:.06em;font-size:13px;display:block}.brand small{display:block;color:#a6c0da;font-size:10px;letter-spacing:.15em}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--sub);font-weight:750;text-transform:uppercase}
.menu{display:grid;gap:5px;margin-top:14px}
.menu button{border:0;background:none;color:#b4c5d7;text-align:left;padding:12px 13px;border-radius:9px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
.menu button.active,.menu button:hover{background:var(--navy2);color:#fff}
.badge{background:#f0a23a;color:#1d2733;border-radius:20px;font-size:11px;padding:1px 8px;font-weight:800}
.sidefoot{color:#9db5cc;font-size:11px;margin:26px 8px;line-height:1.6}
.main{flex:1;padding:28px;min-width:0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.toolbar h1{margin:4px 0 0;font-size:27px}
.userchip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}
.viewselect{display:none;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.viewselect button{border:1px solid #d3dfeb;background:#fff;padding:9px 12px;border-radius:8px;color:#3b536e;font-weight:700;font-size:12px;white-space:nowrap}
.viewselect button.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- common components ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:750}
.btn.danger{background:var(--red)}.btn.green{background:var(--green)}
.secondary{background:#fff;border:1px solid #d5e1ec;color:#344f68;border-radius:9px;padding:10px 13px;font-weight:700}
.secondary.danger{color:var(--red);border-color:#f1c4c0}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;padding:4px}
.muted{color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.metric{padding:18px}.metric strong{display:block;font-size:30px}.metric .muted{margin-bottom:5px}
.green{color:var(--green)}
.pill{display:inline-block;background:var(--greenbg);color:var(--green);font-size:10px;border-radius:30px;padding:5px 10px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.pill.pending{background:var(--amberbg);color:var(--amber)}
.pill.red{background:var(--redbg);color:var(--red)}
.pill.grey{background:#edf1f5;color:#5d6f82}
.pill.blue{background:#e6f0fb;color:var(--blue)}
.rev{font-size:11px;color:var(--blue);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:15px}
.drawer{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.drawer .row{padding:11px 2px}
.drawer .secondary,.drawer .btn{width:100%;font-size:12px}
.drawer .twobtn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.photo{height:130px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(135deg,#788a9b,#36495a);color:#e8f3fc;position:relative;overflow:hidden;cursor:default}
.photo.empty:before{content:"";position:absolute;inset:14px;border:5px solid #334757;border-radius:7px;background:repeating-linear-gradient(90deg,#acbbc9 0 13px,#5d7182 15px 32px);opacity:.35}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo.has{cursor:zoom-in}
.photo span{z-index:1;background:#132a41b8;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:750}
.photo .tag{position:absolute;left:6px;top:6px;z-index:2}
.layout{display:grid;grid-template-columns:1fr 350px;gap:16px}
.side{display:grid;gap:14px;align-content:start}
.list{display:grid;gap:10px;margin-top:15px}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.field{width:100%;border:1px solid #d6e1eb;border-radius:9px;padding:12px;background:#fff;color:var(--text);margin:6px 0 13px}
textarea.field{min-height:84px;resize:vertical}
label{font-size:12px;font-weight:750;display:block}
.check{display:flex;gap:9px;align-items:flex-start;font-weight:600;font-size:13px;margin:6px 0 12px}
.check input{width:20px;height:20px;margin:0;flex:none}
.banner{background:#eaf4ff;border-radius:9px;padding:12px;font-size:12px;color:#466783;line-height:1.5}
.alert{background:#fff6e7;color:#986716;border-radius:8px;padding:10px;font-size:12px;margin-top:10px;line-height:1.5}
.alert.red{background:var(--redbg);color:var(--red)}
.alert.ok{background:var(--greenbg);color:var(--green)}
h2,h3{margin:0 0 9px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--sub);text-transform:uppercase;padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f6f9fc}
.tablewrap{overflow-x:auto}
.search{max-width:320px;margin:0}
.empty{padding:28px;text-align:center;color:var(--sub);font-size:13px}
.spinner{width:22px;height:22px;border:3px solid #cfe0f1;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .photo{height:auto;min-height:220px;aspect-ratio:4/3}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;place-items:center}
.qrbox img{width:170px;height:170px;image-rendering:pixelated}
.qrsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.qrcard{border:1px dashed #b9c8d6;border-radius:12px;padding:14px;text-align:center;background:#fff}
.qrcard img{width:150px;height:150px;image-rendering:pixelated}
.qrcard .logo{height:30px;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.kv:last-child{border-bottom:0}.kv b{text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 8px 24px #0003;max-width:92vw}
.toast.err{background:var(--red)}
.progress{height:8px;background:#e3ecf5;border-radius:8px;overflow:hidden;margin:10px 0}
.progress div{height:100%;background:var(--blue);width:0;transition:width .3s}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:#14253db9;display:grid;place-items:center;padding:18px;z-index:20}
.modal{background:#fff;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:24px}
.modal.wide{width:min(960px,100%)}
.modal.zoom{width:min(1100px,100%);padding:14px}
.modal.zoom img{width:100%;height:auto;border-radius:8px;display:block}
.actionline{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* ---------- mechanic & auditor (phone layout) ---------- */
.mobile-wrap{display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:440px;background:#f4f7fa;display:flex;flex-direction:column;min-height:100vh}
.phonehead{background:var(--navy);color:#fff;padding:22px 18px calc(18px)}
.phonehead .brand{padding-bottom:16px}
.phonehead h2{margin:16px 0 4px}
.phonehead .sub{font-size:12px;color:#b8cbde}
.phonebody{padding:15px;flex:1;padding-bottom:90px}
.phone .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.phone .photo{height:110px}
.phone .drawer{padding:7px}
.phone .panel{padding:15px}
.phone .btn.big{width:100%;padding:16px;font-size:16px}
.phone .secondary.big{width:100%;padding:13px}
.phonefooter{display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:5}
.phonefooter button{background:none;border:0;font-size:11px;font-weight:750;color:#617992;padding:8px 10px;border-radius:8px;display:grid;justify-items:center;gap:2px;min-width:64px}
.phonefooter button .ic{font-size:18px}
.phonefooter button.active{color:var(--blue);background:#eef5fd}
.login .field{font-size:17px}
.codeinput{letter-spacing:10px;text-align:center;font-size:24px!important;font-weight:800}
.report .kv{font-size:13px}

@media(min-width:700px){
  .mobile-wrap{padding:28px 12px;min-height:auto}
  .phone{border:7px solid #263749;border-radius:32px;overflow:hidden;box-shadow:0 16px 40px #192d4325;min-height:760px}
  .phonefooter{position:sticky}
}
@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{width:200px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
  .sidebar{display:none}.main{padding:15px}.viewselect{display:flex}
  .stats{grid-template-columns:repeat(3,1fr);gap:7px}.metric{padding:12px}.metric strong{font-size:24px}
  .grid{grid-template-columns:repeat(2,1fr)}.toolbar h1{font-size:23px}.panel{padding:15px}
  .compare{grid-template-columns:1fr}.hide-sm{display:none}
}

/* ---------- print ---------- */
#print-root{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block;color:#000;font-size:11pt}
  .pr-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #142b43;padding-bottom:8px;margin-bottom:10px}
  .pr-head img{height:46px}
  .pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pr-cell{border:1px solid #bbb;padding:6px;break-inside:avoid}
  .pr-cell img{width:100%;height:auto;max-height:300px;object-fit:contain}
  .pr-limit{border:1px solid #142b43;padding:8px;margin:8px 0;font-size:9.5pt}
  .pr-qr .qrcard{break-inside:avoid;margin-bottom:10px}
  .pr-qr .qrsheet{grid-template-columns:repeat(3,1fr)}
  /* QR labels: A4 full-sheet label paper cut into 4 (each 105 x 148.5 mm) */
  body.printing-labels #print-root{font-size:10pt}
  .lblpage{width:210mm;height:297mm;display:grid;grid-template-columns:105mm 105mm;grid-template-rows:148.5mm 148.5mm;break-after:page;page-break-after:always;overflow:hidden}
  .lblpage:last-child{break-after:auto;page-break-after:auto}
  .lbl{box-sizing:border-box;width:105mm;height:148.5mm;padding:9mm 8mm 7mm;outline:0.2mm dashed #c8c8c8;outline-offset:-0.1mm;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
  .lbl-empty{outline-color:#eee}
  .lbl-logo{height:15mm;max-width:60mm;object-fit:contain}
  .lbl-org{font-weight:700;font-size:10pt;letter-spacing:.12em;margin-top:2mm;color:#102941}
  .lbl-sub{font-size:7.5pt;letter-spacing:.18em;color:#444}
  .lbl-no{font-size:22pt;font-weight:800;margin-top:3mm;color:#102941;line-height:1.1}
  .lbl-name{font-size:12pt;font-weight:600;margin-top:1mm}
  .lbl-qr{margin-top:auto;margin-bottom:auto}
  .lbl-qr svg{width:68mm!important;height:68mm!important;margin:0 auto!important}
  .lbl-foot{font-size:7.5pt;color:#333;border-top:0.3mm solid #102941;padding-top:2mm;width:100%}
  /* small: 12 per A4 sheet (3 x 4), each 70 x 74.25 mm */
  .lblpage.sm{grid-template-columns:70mm 70mm 70mm;grid-template-rows:repeat(4,74.25mm)}
  .lblpage.sm .lbl{width:70mm;height:74.25mm;padding:3.5mm 3mm 2.5mm}
  .lblpage.sm .lbl-logo{height:6.5mm;max-width:34mm}
  .lblpage.sm .lbl-org{font-size:5.8pt;margin-top:.8mm;letter-spacing:.08em}
  .lblpage.sm .lbl-sub{display:none}
  .lblpage.sm .lbl-no{font-size:12pt;margin-top:.6mm}
  .lblpage.sm .lbl-name{font-size:8pt;margin-top:0}
  .lblpage.sm .lbl-qr svg{width:38mm!important;height:38mm!important}
  .lblpage.sm .lbl-foot{font-size:5.2pt;padding-top:.8mm;border-top-width:.2mm}
}
</style>

</head>
<body>
<div id="app"><div class="spinner" role="status" aria-label="Loading"></div></div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal">
    <div class="row"><h3 id="modal-title">&nbsp;</h3><button class="secondary" id="modal-close" aria-label="Close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="print-root" aria-hidden="true"></div>
<script>
/* PCH Toolbox Control – external site. Talks to the private Google back-end through a JSON API
   (no Google cookies are sent, so phones signed in to several Google accounts work). */
var API_URL = 'https://script.google.com/macros/s/AKfycbzrdwJ52aN-Jr_YDuo62rOBhnGUdUMB9Ayvv0rBmLwqrELb-v0UaHkswoReR4hYRBcVlQ/exec';
var BOOT = (function () {
  var p = new URLSearchParams(location.search), t = p.get('t') || '', v = p.get('view') || '', s = p.get('s') || '';
  return { publicToken: /^[0-9a-f]{64}$/.test(t) ? t : '', view: ['review', 'lost', 'pending'].indexOf(v) > -1 ? v : '',
    submissionId: /^SUB-[0-9A-F]{12}$/.test(s) ? s : '', legacyLink: p.has('box'), badToken: !!t && !/^[0-9a-f]{64}$/.test(t) };
})();
var LOGO = '';
var MARK = 'icon-mark.png'; /* PCH emblem (white on blue) for the app header */
function apiCall(fn, args) {
  return fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args }) }).then(function (r) { if (!r.ok) throw new Error('Server unavailable (' + r.status + '). Please try again.'); return r.json(); });
}
window.google = { script: { run: (function mk(ok, ko) { return new Proxy({}, { get: function (_, fn) {
  if (fn === 'withSuccessHandler') return function (f) { return mk(f, ko); };
  if (fn === 'withFailureHandler') return function (f) { return mk(ok, f); };
  return function () { var args = Array.prototype.slice.call(arguments);
    apiCall(fn, args).then(function (j) { if (j && j.ok) { ok && ok(j.result); } else { ko && ko(new Error((j && j.error) || 'Unexpected error')); } })
      .catch(function (e) { ko && ko(new Error(e && e.message ? e.message : 'Network error – check your connection.')); }); };
} }); })() } };
function bootStatic() {
  var cached = null; try { cached = JSON.parse(localStorage.getItem('pchtc_assets') || 'null'); } catch (e) { }
  var go = function (a) { LOGO = a.logo || ''; if (a.qrLib && typeof qrcode !== 'function') { try { window.qrcode = new Function(a.qrLib + '; return qrcode;')(); } catch (e) { } } start(); };
  if (cached && cached.v === 1) { go(cached); apiCall('getAppAssets', []).then(function (j) { if (j && j.ok) { try { j.result.v = 1; localStorage.setItem('pchtc_assets', JSON.stringify(j.result)); } catch (e) { } } }); return; }
  apiCall('getAppAssets', []).then(function (j) { var a = (j && j.ok) ? j.result : {}; a.v = 1; try { localStorage.setItem('pchtc_assets', JSON.stringify(a)); } catch (e) { } go(a); })
    .catch(function () { go({}); });
}
</script>
<script>
/* PCH Toolbox Control — client. UI only: every permission is enforced on the server. */
'use strict';
var S = { token: null, user: null, view: 'dashboard', cache: {}, imgs: {}, boxes: null };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad2(n) { n = Number(n || 0); return n < 10 ? '0' + n : String(n); }
var DTF = new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Brisbane', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
var DF = new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Brisbane', day: '2-digit', month: '2-digit', year: 'numeric' });
function fdt(iso) { return iso ? DTF.format(new Date(iso)) : '—'; }
function fd(iso) { return iso ? DF.format(new Date(iso)) : '—'; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function uid() { try { return crypto.randomUUID(); } catch (e) { var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a).map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); } }
function boxName(b) { return (b.toolboxNumber ? b.toolboxNumber + ' · ' : '') + (b.label || ''); }
var STATUS_PILL = { ACTIVE: '', TEST: 'blue', DRAFT: 'grey', ARCHIVED: 'grey', PENDING: 'pending', APPROVED: '', REJECTED: 'red', INVITED: 'pending', INACTIVE: 'grey', OPEN: 'red', CLOSED_FOUND: '', CLOSED_NOT_FOUND: 'grey', SUBMITTED: 'pending', ARCHIVED_EV: 'grey', MISSING_TOOL_REPORTED: 'red', MISSING_TOOL_CLOSED: 'grey', PHOTO_REMOVED: 'grey', ALL_PRESENT: '', EXCEPTIONS: 'red' };
var STATUS_TEXT = { ALL_PRESENT: 'ALL PRESENT', EXCEPTIONS: 'EXCEPTIONS', CLOSED_FOUND: 'CLOSED – FOUND', CLOSED_NOT_FOUND: 'CLOSED – NOT FOUND', OPEN: 'OPEN TOOL DISCREPANCY', PENDING: 'AWAITING APPROVAL', MISSING_TOOL_REPORTED: 'MISSING TOOL', MISSING_TOOL_CLOSED: 'DISCREPANCY CLOSED', PHOTO_REMOVED: 'PHOTO REMOVED' };
function evTitle(h) { return /^MISSING_TOOL/.test(h.eventType) ? (h.drawerNumber ? 'Drawer ' + pad2(h.drawerNumber) : 'Toolbox') : 'Drawer ' + pad2(h.drawerNumber) + ' · Rev ' + pad2(h.revision); }
function pill(st) { return '<span class="pill ' + (STATUS_PILL[st] || 'grey') + '">' + esc(STATUS_TEXT[st] || st) + '</span>'; }

// ---------- server calls ----------
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      var m = (e && e.message) ? e.message : String(e);
      m = m.replace(/^Error:\s*/, '');
      if (m.indexOf('PIN_CHANGE_REQUIRED') === 0) { renderChangePin(true); return; }
      if (m.indexOf('SESSION_EXPIRED') === 0) { if (S.token) signOutLocal('Your session has ended. Please sign in again.'); return; } // never settles: the screen has been replaced
      reject(new Error(m));
    })[fn].apply(null, args);
  });
}
function authed(fn) { return api.apply(null, [fn, S.token].concat(Array.prototype.slice.call(arguments, 1))); }

function toast(msg, err) {
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 6000 : 3500);
}
function fail(e) { toast(e && e.message ? e.message : String(e), true); }
function loading(el) { (typeof el === 'string' ? $(el) : el).innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>'; }

// ---------- modal ----------
function openModal(title, html, cls) {
  $('modal').className = 'modal' + (cls ? ' ' + cls : '');
  $('modal-title').textContent = title; $('modal-body').innerHTML = html;
  $('overlay').classList.remove('hidden'); setTimeout(function () { $('modal-close').focus(); }, 30);
}
function closeModal() { $('overlay').classList.add('hidden'); $('modal-body').innerHTML = ''; }
$('modal-close').onclick = closeModal;
$('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').classList.contains('hidden')) closeModal(); });

// ---------- branding ----------
function brand(sub, light) {
  var mark = typeof MARK !== 'undefined' && MARK;
  var icon = mark ? '<div class="brand-icon mark"><img src="' + mark + '" alt="Pacific Crown Helicopters"></div>'
    : LOGO ? '<div class="brand-icon"><img src="' + LOGO + '" alt="Pacific Crown Helicopters logo"></div>' : '<div class="brand-icon txt">P</div>';
  return '<div class="brand">' + icon + '<div><strong>PACIFIC CROWN</strong><small>' + esc(sub || 'HELICOPTERS') + '</small></div></div>';
}

// ---------- images (private proxy) ----------
function imgKey(kind, a, size) { return kind + ':' + a + ':' + size; }
function fetchImage(kind, a, b, size) {
  var k = imgKey(kind, kind === 'pub' ? b : a, size);
  if (S.imgs[k]) return Promise.resolve(S.imgs[k]);
  var p;
  if (kind === 'pub') p = api('getPublicDrawerImage', a, b, size);
  else if (kind === 'drawer') p = authed('getDrawerImage', a, size);
  else p = authed('getSubmissionImage', a, size);
  return p.then(function (r) { S.imgs[k] = r.dataUrl; return r.dataUrl; });
}
/** <div class="photo" data-img="kind|a|b">; thumbnails load lazily when visible */
function photoHtml(kind, a, b, has, label, extraTag) {
  if (!has) return '<div class="photo empty"><span>' + esc(label || 'No approved photo') + '</span>' + (extraTag || '') + '</div>';
  return '<div class="photo has" tabindex="0" role="button" aria-label="Open photo: ' + esc(label || '') + '" data-img="' + kind + '|' + esc(a) + '|' + esc(b || '') + '" data-label="' + esc(label || '') + '"><span>Loading…</span>' + (extraTag || '') + '</div>';
}
var IO = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
  es.forEach(function (en) { if (en.isIntersecting) { IO.unobserve(en.target); loadThumb(en.target); } });
}, { rootMargin: '200px' }) : null;
function hydratePhotos(root) {
  (root || document).querySelectorAll('.photo[data-img]').forEach(function (el) {
    if (el.dataset.bound) return; el.dataset.bound = '1';
    if (IO) IO.observe(el); else loadThumb(el);
    var open = function () { zoomPhoto(el); };
    el.addEventListener('click', open);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });
}
function loadThumb(el) {
  var p = el.dataset.img.split('|');
  fetchImage(p[0], p[1], p[2], 'thumb').then(function (url) {
    var img = new Image(); img.alt = el.dataset.label || 'Drawer photo'; img.src = url;
    var sp = el.querySelector('span'); if (sp) sp.remove(); el.insertBefore(img, el.firstChild);
  }).catch(function () { var sp = el.querySelector('span'); if (sp) sp.textContent = 'Photo unavailable'; });
}
function zoomPhoto(el) {
  var p = el.dataset.img.split('|');
  openModal(el.dataset.label || 'Photo', '<div class="spinner"></div><p class="muted">Photos are displayed by PCH Toolbox Control only. No Google Drive links are used.</p>', 'zoom');
  fetchImage(p[0], p[1], p[2], 'full').then(function (url) {
    $('modal-body').innerHTML = '<img src="' + url + '" alt="' + esc(el.dataset.label || 'Drawer photo') + '"><p class="muted">Tap outside or press ✕ to close.</p>';
  }).catch(function (e) { $('modal-body').innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
}

// ---------- start ----------
function start() {
  if (BOOT.publicToken) return renderAuditor(BOOT.publicToken);
  if (BOOT.legacyLink || BOOT.badToken) return renderNotice('This QR code is no longer valid', 'This link format has been replaced. Please contact the PCH tool controller for the current toolbox QR code.');
  S.token = store('pchtc_session');
  if (!S.token) return renderLogin();
  api('getMe', S.token).then(function (u) { S.user = u; route(); }).catch(function () { store('pchtc_session', null); renderLogin(); });
}
function route() {
  if (S.user.mustChangePin) return renderChangePin(true);
  document.body.classList.toggle('role-quality', S.user.role === 'QUALITY');
  if (S.user.role === 'ADMIN' || S.user.role === 'QUALITY') {
    var v = BOOT.view === 'review' || BOOT.view === 'pending' ? 'pending' : BOOT.view === 'lost' ? 'lost' : 'dashboard';
    renderAdminShell(v);
    if (BOOT.view === 'review' && BOOT.submissionId) setTimeout(function () { openReview(BOOT.submissionId); }, 400);
    BOOT.view = ''; BOOT.submissionId = '';
  } else renderMechanic();
}
function signOutLocal(msg) { store('pchtc_session', null); S.token = null; S.user = null; S.imgs = {}; closeModal(); renderLogin(msg); }
function signOut() { var t = S.token; signOutLocal('You have signed out.'); if (t) api('logout', t).catch(function () { }); }

    });

}

/** Resize on the device: longest edge 1600 px (JPEG 0.8) + 400 px thumbnail (JPEG 0.7). */
function prepareImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file); var img = new Image();
    img.onload = function () {
      try {
        var out = function (max, q) { var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); var c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q); };
        var full = out(1600, 0.8), th = out(400, 0.7);
        URL.revokeObjectURL(url);
        resolve({ preview: th, photo: full.split(',')[1], thumb: th.split(',')[1] });
      } catch (e) { reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

function copyText(t) {

function qrImg(url, cell) {
  if (typeof qrcode !== 'function') return '<p class="muted">QR generator unavailable.</p>';
  var q = qrcode(0, 'M'); q.addData(url); q.make();
  return '<img alt="QR code for the toolbox auditor view" src="' + q.createDataURL(cell || 4, 2) + '">';
}
/** Prints only after every image in the print area has finished loading (QR codes, photos, logo). */
function printWhenReady() {
  var imgs = Array.prototype.slice.call($('print-root').querySelectorAll('img'));
  Promise.all(imgs.map(function (im) {
    if (im.complete && im.naturalWidth) return Promise.resolve();
    return new Promise(function (r) { im.onload = im.onerror = function () { r(); }; });
  })).then(function () { setTimeout(function () { window.print(); }, 300); });
}
/** Vector QR for printing (prints sharply and does not depend on image decoding). */
function qrSvg(url) {
  if (typeof qrcode !== 'function') return '<p>QR generator unavailable.</p>';
  var q = qrcode(0, 'M'); q.addData(url); q.make();
  var n = q.getModuleCount(), m = 2, size = n + m * 2, path = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) path += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="160" height="160" shape-rendering="crispEdges" style="display:block;margin:8px auto"><rect width="100%" height="100%" fill="#fff"/><path d="' + path + '" fill="#000"/></svg>';
}

  if (!items || !items.length) { toast('No QR codes to print.'); return; }

    '<p class="muted" style="margin:-4px 0 14px">For A4 full-sheet self-adhesive label paper (210 × 297 mm). 4 labels per sheet — cut along the dashed lines. In the print window set <b>Scale 100%</b> and <b>Margins: None</b>.</p>' +

    '<p class="muted" style="margin:-4px 0 4px">Same label paper, 3 × 4 labels per sheet. Same print settings.</p>');

/** QR labels. large: exactly 1/4 of A4 (105 x 148.5 mm), 4 per sheet for full-sheet A4 label paper. small: original compact card. */
function printQr(items, size) {
  var st = document.getElementById('lbl-page-style');
  if (!st) { st = document.createElement('style'); st.id = 'lbl-page-style'; document.head.appendChild(st); }
  var per = size === 'large' ? 4 : 12, cls = size === 'large' ? 'lblpage' : 'lblpage sm';
  var pages = [];
  for (var i = 0; i < items.length; i += per) pages.push(items.slice(i, i + per));
  $('print-root').innerHTML = pages.map(function (pg) {
    var cells = pg.map(function (t) {
      return '<div class="lbl">' + (LOGO ? '<img class="lbl-logo" src="' + LOGO + '" alt="">' : '') +
        '<div class="lbl-org">PACIFIC CROWN HELICOPTERS</div><div class="lbl-sub">TOOL CONTROL REGISTER</div>' +
        '<div class="lbl-no">Toolbox ' + esc(t.toolboxNumber || '') + '</div><div class="lbl-name">' + esc(t.label || '') + '</div>' +
        '<div class="lbl-qr">' + qrSvg(t.url) + '</div>' +
        '<div class="lbl-foot">Scan to view the approved drawer photo register (read-only)</div></div>';
    });
    while (cells.length < per) cells.push('<div class="lbl lbl-empty"></div>');
    return '<div class="' + cls + '">' + cells.join('') + '</div>';
  }).join('');
  st.textContent = '@page{size:A4 portrait;margin:0}';
  document.body.classList.add('printing-labels');
  var done = function () { st.textContent = ''; document.body.classList.remove('printing-labels'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  printWhenReady();
}

            (u.status === 'INVITED' ? '<button class="btn mgr" data-act="' + u.userId + '">Approve access</button>' : '') + (u.role === 'MECHANIC' ? '<button class="secondary mgr" data-pin="' + u.userId + '">' + (u.hasPin ? 'Reset PIN' : 'Issue PIN') + '</button>' : '') + '<button class="secondary mgr" data-edit="' + u.userId + '">Edit</button><button class="secondary danger mgr" data-deact="' + u.userId + '">Deactivate</button>') +
          '</div></td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">None.</td></tr>';
    };
    var head = '<thead><tr><th>Employee</th><th>Role</th><th>Status</th><th>Login / PIN</th><th class="hide-sm">Toolboxes</th><th class="hide-sm">Last sign-in</th><th></th></tr></thead>';
    body.innerHTML = '<div class="panel"><div class="row"><div><h3>Employees &amp; Access</h3><div class="muted">Only the administrator and the Quality Manager register mechanics. A welcome e-mail with the app link, login name and PIN is sent automatically. There is no self-registration.</div></div><div class="gap"><button class="secondary mgr" id="e-shared">Same PIN for all mechanics</button><button class="secondary mgr" id="e-pins">Issue individual PINs</button><button class="btn" id="e-add">+ Add employee</button></div></div>' +
      '<div class="tablewrap"><table class="tbl" style="margin-top:12px">' + head + '<tbody>' + rows(act, false) + '</tbody></table></div></div>' +
      '<div class="panel" style="margin-top:14px" id="former"><h3>Former Employees</h3><div class="muted">Deactivated accounts: access revoked; records, photos and history are preserved. Visible to administrators only.</div>' +
      '<div class="tablewrap"><table class="tbl" style="margin-top:12px">' + head + '<tbody>' + rows(former, true) + '</tbody></table></div></div>';
    $('e-add').onclick = function () { employeeForm(null); };
    $('e-pins').onclick = function () { issuePins([]); };
    $('e-shared').onclick = function () {
      openModal('Same PIN for all mechanics', '<p>Every mechanic signs in with their <b>surname</b> and this PIN. New mechanics get it automatically. Each person can still change to a personal PIN later.</p>' +
        '<div class="alert">Anyone who knows a surname and this PIN can sign in as that mechanic. Photo changes still need approval by the administrator or Quality Manager.</div>' +
        '<form id="sp"><label for="sp-pin">Shared PIN (3–6 numbers)</label><input class="field codeinput" id="sp-pin" inputmode="numeric" maxlength="6" required>' +
        '<div class="actionline"><button class="secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn">Apply to all mechanics</button></div></form>');
      $('sp').onsubmit = function (e) {
        e.preventDefault();
        authed('adminSetSharedPin', $('sp-pin').value).then(function (list) {
          $('modal-body').innerHTML = '<div class="alert ok">Shared PIN applied to ' + list.length + ' mechanics.</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Employee</th><th>Login name</th><th>Account</th></tr></thead><tbody>' +
            list.map(function (x) { return '<tr><td>' + esc(x.displayName) + '</td><td><b>' + esc(x.loginName) + '</b></td><td>' + esc(x.status) + '</td></tr>'; }).join('') + '</tbody></table></div><div class="actionline"><button class="btn" onclick="closeModal();adminView(\'employees\')">Done</button></div>';
        }).catch(fail);
      };
    };
    body.querySelectorAll('[data-pin]').forEach(function (b) { b.onclick = function () {
      var u = users.find(function (x) { return x.userId === b.dataset.pin; });
      if (u.hasPin && !confirm('Issue a new temporary PIN for ' + u.displayName + '? Their current PIN stops working and they are signed out.')) return;
      issuePins([u.userId]); }; });
    body.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { employeeForm(users.find(function (u) { return u.userId === b.dataset.edit; })); }; });
    body.querySelectorAll('[data-act],[data-react]').forEach(function (b) { b.onclick = function () { setStatus(b.dataset.act || b.dataset.react, 'ACTIVE'); }; });
    body.querySelectorAll('[data-deact]').forEach(function (b) { b.onclick = function () {
      var u = users.find(function (x) { return x.userId === b.dataset.deact; });
      if (confirm('Deactivate ' + u.displayName + '? Their access is revoked immediately; history is kept under Former Employees.')) setStatus(u.userId, 'INACTIVE'); }; });
    if (focus === 'former') $('former').scrollIntoView();
  }).catch(function (e) { body.innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
}
function issuePins(ids) {
  openModal('Temporary PINs', '<div class="spinner"></div>', 'wide');
  authed('adminIssuePins', ids).then(function (list) {
    if (!list.length) { $('modal-body').innerHTML = '<p>Everyone already has a PIN.</p>'; return; }
    var rows = list.map(function (x) { return '<tr><td><b>' + esc(x.displayName) + '</b></td><td>' + esc(x.loginName) + '</td><td style="font-size:20px;letter-spacing:4px"><b>' + esc(x.pin) + '</b></td><td>' + esc(x.status) + '</td></tr>'; }).join('');
    $('modal-body').innerHTML = '<div class="alert">These temporary PINs are shown <b>only now</b> (they are stored encrypted). Give each person their own PIN privately. At first sign-in they must create a personal PIN. INVITED accounts also need <b>Approve access</b>.</div>' +
      '<div class="tablewrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Employee</th><th>Login name</th><th>Temporary PIN</th><th>Account</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="actionline"><button class="secondary" id="pin-print">Print slips</button><button class="btn" id="pin-done">Done</button></div>';
    $('pin-done').onclick = function () { closeModal(); adminView('employees'); };
    $('pin-print').onclick = function () {
      $('print-root').innerHTML = list.map(function (x) {
        return '<div style="border:1px dashed #555;padding:12px;margin:8px 0;break-inside:avoid"><b>PCH Toolbox Control – personal sign-in</b><br>' + esc(x.displayName) +
          '<br>Login name: <b>' + esc(x.loginName) + '</b><br>Temporary PIN: <b style="font-size:16pt;letter-spacing:4px">' + esc(x.pin) + '</b><br><span style="font-size:8pt">Open the app, sign in, then create your own PIN. Do not share it.</span></div>'; }).join('');
      printWhenReady();
    };
  }).catch(function (e) { $('modal-body').innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
}
function setStatus(id, st) {
  authed('adminSetUserStatus', id, st).then(function () { toast(st === 'ACTIVE' ? 'Access approved. The employee has been e-mailed.' : 'Employee deactivated and signed out.'); adminView('employees'); }).catch(fail);
}
function employeeForm(u) {
  var boxes = (S.allBoxes || []).filter(function (t) { return t.status !== 'ARCHIVED'; });
  var have = u ? u.toolboxes.map(function (t) { return t.toolboxId; }) : [];
  var canSub = u ? (u.toolboxes.length ? u.toolboxes[0].canSubmit : true) : true;
  var qm = S.user.role === 'QUALITY';
  openModal(u ? 'Edit employee' : (qm ? 'Register Mechanic' : 'Add Employee'), '<form id="ef">' +
    '<label for="ef-name">Full name</label><input class="field" id="ef-name" required maxlength="80" value="' + esc(u ? u.displayName : '') + '">' +
    '<label for="ef-email">E-mail (the welcome e-mail with the app link, login and PIN goes here)</label><input class="field" id="ef-email" type="email" required maxlength="254" value="' + esc(u ? u.email : '') + '"' + (u ? ' disabled' : '') + '>' +
    '<div class="compare"><div><label for="ef-emp">Employee No. (optional)</label><input class="field" id="ef-emp" maxlength="20" value="' + esc(u ? u.employeeNo || '' : '') + '"></div>' +
    '<div><label for="ef-tag">Tool Tag No. (optional)</label><input class="field" id="ef-tag" maxlength="20" value="' + esc(u ? u.toolTagNo || '' : '') + '"></div></div>' +
    (u && u.role === 'MECHANIC' ? '<label for="ef-login">Login name (used with the PIN)</label><input class="field" id="ef-login" maxlength="30" value="' + esc(u.loginName || '') + '">' : '') +
    '<label for="ef-role">Role</label><select class="field" id="ef-role"><option value="MECHANIC">Mechanic</option>' + (qm ? '' : '<option value="QUALITY"' + (u && u.role === 'QUALITY' ? ' selected' : '') + '>Quality Manager (view all, approve/reject, close discrepancies – no settings)</option><option value="ADMIN"' + (u && u.role === 'ADMIN' ? ' selected' : '') + '>Administrator (full control)</option>') + '</select>' +
    '<label>Assigned toolboxes</label><div style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px;margin:6px 0 13px">' + (boxes.length ? boxes.map(function (t) {
      return '<label class="check"><input type="checkbox" name="ef-tb" value="' + t.toolboxId + '"' + (have.indexOf(t.toolboxId) > -1 ? ' checked' : '') + '> ' + esc(boxName(t)) + ' <span class="muted">' + esc(t.status) + '</span></label>'; }).join('') : '<p class="muted">No toolboxes yet.</p>') + '</div>' +
    '<label class="check"><input type="checkbox" id="ef-sub"' + (canSub ? ' checked' : '') + '> May submit drawer photos for assigned toolboxes</label>' +
    (u ? '' : '<label class="check"><input type="checkbox" id="ef-act" checked> Activate now and send the welcome e-mail (app link, login name, PIN and instructions). Untick to create as INVITED awaiting approval.</label>') +
    '<div class="banner">No automatic registration from the personnel matrix. Verify the person before granting access.</div>' +
    '<div class="actionline"><button class="secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn">' + (u ? 'Save' : 'Create employee') + '</button></div></form>');
  $('ef').onsubmit = function (e) {
    e.preventDefault();
    var tbs = Array.prototype.slice.call(document.querySelectorAll('input[name=ef-tb]:checked')).map(function (x) { return x.value; });
    var p = u ? (($('ef-login') && $('ef-login').value && $('ef-login').value !== (u.loginName || '')) ? authed('adminSetLoginName', u.userId, $('ef-login').value) : Promise.resolve()).then(function () { return authed('adminUpdateEmployee', u.userId, { displayName: $('ef-name').value, role: $('ef-role').value, employeeNo: $('ef-emp').value, toolTagNo: $('ef-tag').value }); }).then(function () { return authed('adminSetAssignments', u.userId, tbs, $('ef-sub').checked); })
      : authed('adminCreateEmployee', { displayName: $('ef-name').value, email: $('ef-email').value, role: $('ef-role').value, employeeNo: $('ef-emp').value, toolTagNo: $('ef-tag').value, toolboxIds: tbs, canSubmit: $('ef-sub').checked, activateNow: $('ef-act').checked });
    var actNow = !u && $('ef-act').checked;
    p.then(function () { closeModal(); toast(u ? 'Employee updated.' : (actNow ? 'Employee created. Welcome e-mail sent.' : 'Employee created (awaiting approval).')); adminView('employees'); }).catch(fail);
  };
}

// ---- revision history ----
function aHistory(body) {
  authed('adminListToolboxes').then(function (tbs) {
    body.innerHTML = '<div class="panel"><div class="row"><select class="field search" id="h-tb" aria-label="Filter by toolbox"><option value="">All toolboxes</option>' + tbs.map(function (t) { return '<option value="' + t.toolboxId + '">' + esc(boxName(t)) + '</option>'; }).join('') + '</select></div><div id="h-rows"></div></div>';
    var load = function () {
      loading('h-rows');
      authed('getRevisionHistory', $('h-tb').value || null).then(function (rows) {
        $('h-rows').innerHTML = '<div class="tablewrap"><table class="tbl"><thead><tr><th>Date (Brisbane)</th><th>Toolbox</th><th>Drawer</th><th>Rev</th><th>Event</th><th class="hide-sm">Description</th><th>By</th></tr></thead><tbody>' + (rows.map(function (h) {
          return '<tr><td>' + fdt(h.occurredAt) + '</td><td>' + esc((h.toolboxNumber || '') + ' ' + (h.toolboxLabel || '')) + '</td><td>' + (h.drawerNumber ? pad2(h.drawerNumber) : '—') + '</td><td>' + (/^MISSING/.test(h.eventType) ? '—' : 'R' + pad2(h.revision)) + '</td><td>' + pill(h.eventType) + '</td><td class="hide-sm">' + esc(h.description) + '</td><td>' + esc(h.actor) + '</td></tr>'; }).join('') || '<tr><td colspan="7" class="empty">No history yet.</td></tr>') + '</tbody></table></div>';
      }).catch(function (e) { $('h-rows').innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
    };
    $('h-tb').onchange = load; load();
  }).catch(function (e) { body.innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
}

// ---- lost tools ----
function aLost(body) {
  body.innerHTML = '<div class="panel"><div class="row"><div><h3>Lost Tools</h3><div class="muted">Discrepancies stay OPEN until an administrator closes them after review.</div></div><select class="field search" id="l-st" aria-label="Filter"><option value="OPEN">Open</option><option value="">All</option></select></div><div id="l-rows"></div></div>';
  var load = function () {
    loading('l-rows');
    authed('listLostTools', $('l-st').value || null).then(function (rows) {
      $('l-rows').innerHTML = rows.length ? rows.map(function (r) {
        return '<div class="item"><div class="row"><b>' + esc(r.reportId) + ' · Toolbox ' + esc(r.toolboxNumber || '') + ' ' + esc(r.toolboxLabel || '') + (r.drawerNumber ? ' · Drawer ' + pad2(r.drawerNumber) : '') + '</b>' + pill(r.status) + '</div>' +
          '<div>' + esc(r.toolDescription) + '</div><div class="muted">Reported by ' + esc(r.reportedBy) + ' · ' + fdt(r.reportedAt) + (r.lastSeen ? ' · Last seen: ' + esc(r.lastSeen) : '') + '</div>' +
          (r.status === 'OPEN' ? '<button class="btn" style="margin-top:8px" data-res="' + r.reportId + '">Close discrepancy…</button>' : '<div class="muted">Closed by ' + esc(r.resolvedBy) + ' · ' + fdt(r.resolvedAt) + ' · ' + esc(r.resolution) + '</div>') + '</div>'; }).join('') : '<div class="empty">No reports.</div>';
      $('l-rows').querySelectorAll('[data-res]').forEach(function (b) { b.onclick = function () { resolveForm(b.dataset.res, load); }; });
    }).catch(function (e) { $('l-rows').innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
  };
  $('l-st').onchange = load; load();
}
function resolveForm(id, after) {
  openModal('Close ' + id, '<form id="rs"><label class="check"><input type="radio" name="rs" value="CLOSED_FOUND"> Tool found</label><label class="check"><input type="radio" name="rs" value="CLOSED_NOT_FOUND"> Not found – lost-tool procedure completed</label>' +
    '<label for="rs-txt">Resolution / actions taken</label><textarea class="field" id="rs-txt" required maxlength="500"></textarea><div class="actionline"><button class="secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn">Close discrepancy</button></div></form>');
  $('rs').onsubmit = function (e) {
    e.preventDefault(); var v = (document.querySelector('input[name=rs]:checked') || {}).value;
    if (!v) { toast('Choose an outcome.', true); return; }
    authed('resolveLostTool', id, v, $('rs-txt').value).then(function () { closeModal(); toast('Discrepancy closed.'); after(); }).catch(fail);
  };
}

// ---- QR codes ----
function aQr(body) {
  authed('adminGetQrSheet', null).then(function (items) {
    body.innerHTML = '<div class="panel"><div class="row"><div><h3>QR Codes</h3><div class="muted">One permanent QR per toolbox. It keeps working when photos are updated. Active and test toolboxes are listed.</div></div><button class="btn" id="q-print">Print labels…</button></div>' +
      '<div class="qrsheet" style="margin-top:14px">' + items.map(function (t) {
        return '<div class="qrcard">' + (LOGO ? '<img class="logo" src="' + LOGO + '" alt="">' : '') + '<div class="eyebrow">Tool Control Register</div><h3 style="margin:4px 0">Toolbox ' + esc(t.toolboxNumber || '') + '</h3><div>' + esc(t.label) + '</div>' + qrImg(t.url, 4) +
          '<div class="gap" style="justify-content:center"><button class="secondary" data-copy="' + esc(t.url) + '">Copy link</button>' + (t.publicEnabled ? '' : '<span class="pill grey">QR OFF</span>') + '</div></div>'; }).join('') + '</div></div>';
    body.querySelectorAll('[data-copy]').forEach(function (b) { b.onclick = function () { copyText(b.dataset.copy); }; });
    $('q-print').onclick = function () { pickAndPrintQr(items); };
  }).catch(function (e) { body.innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
}

// ---- settings ----
function aSettings(body) {
  Promise.all([authed('adminGetSettings'), authed('adminGetLegacyMapping')]).then(function (r) {
    var s = r[0], lm = r[1];
    body.innerHTML = '<div class="layout"><div class="panel"><h3>System settings</h3><form id="st">' +
      '<label for="st-org">Organisation name</label><input class="field" id="st-org" maxlength="80" value="' + esc(s.orgName) + '">' +
      '<label class="check"><input type="checkbox" id="st-pub"' + (s.publicAuditorEnabled ? ' checked' : '') + '> Public QR auditor access enabled (anyone holding a toolbox QR can view its approved photos)</label>' +
      '<label for="st-lost">Missing-tool alert e-mails (one or more, separated by commas)</label><textarea class="field" id="st-lost" placeholder="e.g. qasm@pch.com.au, stores@pch.com.au">' + esc(String(s.lostToolEmails || '').split(',').join(', ')) + '</textarea>' +
      '<p class="muted" style="margin-top:-6px">Every missing-tool alert from a mechanic is e-mailed to these addresses. If empty, it goes to the administrators.</p>' +
      '<label for="st-reg">Register PDF e-mails – receive the updated register PDF (new REV) after every approval</label><textarea class="field" id="st-reg" placeholder="e.g. gavin.merten@pacificcrown.com">' + esc(String(s.registerEmails || '').split(',').join(', ')) + '</textarea>' +
      '<label for="st-mail">Extra notification e-mails for photo approvals (comma separated)</label><input class="field" id="st-mail" value="' + esc(s.notifyEmails) + '">' +
      '<button class="btn">Save settings</button></form></div>' +
      '<div class="side"><div class="panel"><h3>Application</h3>' + kv('App URL', 'PCH Toolbox Control web app') + '<button class="secondary" id="st-copy" style="margin-top:8px">Copy app link</button>' +
      '<p class="muted">Drive and Sheets are private back-end storage and are not used by staff or auditors.</p></div></div></div>' +
      '<div class="panel" style="margin-top:14px"><h3>Existing Drive folders – dry-run mapping</h3><div class="muted">Read-only proposal from the original "CMC TOOLS CONTROL QR CODE" folders. Nothing here has been applied. Imported toolboxes start as DRAFT.</div>' +
      '<div class="tablewrap"><table class="tbl" style="margin-top:10px"><thead><tr><th>Current folder</th><th>Files</th><th>Proposed</th><th>Roster cross-check</th><th>Ambiguity</th><th>Status</th></tr></thead><tbody>' +
      (lm.map(function (x) { return '<tr><td>' + esc(x.currentName) + '</td><td>' + esc(x.fileCount) + '</td><td>' + esc((x.proposedToolboxNumber || '?') + ' – ' + x.proposedLabel) + '</td><td>' + esc(x.rosterNote) + '</td><td>' + esc(x.ambiguity) + '</td><td>' + esc(x.status) + '</td></tr>'; }).join('') || '<tr><td colspan="6" class="empty">None.</td></tr>') + '</tbody></table></div></div>';
    $('st-copy').onclick = function () { copyText(s.appUrl); };
    $('st').onsubmit = function (e) {
      e.preventDefault();
      authed('adminUpdateSettings', { orgName: $('st-org').value, publicAuditorEnabled: $('st-pub').checked, notifyEmails: $('st-mail').value, lostToolEmails: $('st-lost').value, registerEmails: $('st-reg').value }).then(function () { toast('Settings saved.'); }).catch(fail);
    };
  }).catch(function (e) { body.innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
}

// ---- audit ----
function aAudit(body, page) {
  page = page || 0;
  authed('adminGetAuditLog', page).then(function (r) {
    body.innerHTML = '<div class="panel"><div class="row"><div><h3>Audit Log</h3><div class="muted">' + r.total + ' events · append-only</div></div><div class="gap">' +
      (page > 0 ? '<button class="secondary" id="au-prev">← Newer</button>' : '') + ((page + 1) * 100 < r.total ? '<button class="secondary" id="au-next">Older →</button>' : '') + '</div></div>' +
      '<div class="tablewrap"><table class="tbl" style="margin-top:10px"><thead><tr><th>Date (Brisbane)</th><th>Actor</th><th>Action</th><th class="hide-sm">Target</th><th class="hide-sm">Details</th></tr></thead><tbody>' +
      r.rows.map(function (e) { return '<tr><td>' + fdt(e.createdAt) + '</td><td>' + esc(e.actor) + '</td><td>' + esc(e.action) + '</td><td class="hide-sm">' + esc(e.targetType + ' ' + e.targetId) + '</td><td class="hide-sm" style="font-size:11px">' + esc(e.details) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    if ($('au-prev')) $('au-prev').onclick = function () { aAudit(body, page - 1); };
    if ($('au-next')) $('au-next').onclick = function () { aAudit(body, page + 1); };
  }).catch(function (e) { body.innerHTML = '<div class="alert red">' + esc(e.message) + '</div>'; });
}

bootStatic();
</script>
